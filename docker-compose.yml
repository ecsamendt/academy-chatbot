# Local development: Postgres + pgvector, the API, and the ingestion worker.
#   cp .env.example .env   (then fill in secrets)
#   docker compose up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: coach
      POSTGRES_DB: coach
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coach"]
      interval: 5s
      retries: 10

  api:
    build: ./coach-service
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./coach-service
    env_file: .env
    command: python -m app.worker
    volumes:
      - workdata:/app/var
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  workdata:
